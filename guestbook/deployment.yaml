apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  namespace: guestbook
  annotations:
    [kubernetes.io/change-cause:](https://kubernetes.io/change-cause:) "v${{ github.run_number }} sha ${{ github.sha }}"
    org.opencontainers.image.revision: "${{ github.sha }}"
    org.opencontainers.image.version: "v${{ github.run_number }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
      annotations:
        org.opencontainers.image.revision: "${{ github.sha }}"
    spec:
      containers:
      - name: guestbook
        image: ghcr.io/nikhil-vichare114/guestbook:latest
        ports:
        - containerPort: 80
